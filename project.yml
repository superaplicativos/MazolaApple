# project.yml — XcodeGen spec para o MazolaEffect
# Gere o .xcodeproj com:
#   brew install xcodegen
#   xcodegen generate
# Repo: https://github.com/yonaskolb/XcodeGen

name: MazolaEffect
options:
  bundleIdPrefix: com.superaplicativos
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: MazolaEffect/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.superaplicativos.mazolaeffect
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_OBJC_BRIDGING_HEADER: ""
    ENABLE_PREVIEWS: YES
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  MazolaEffect:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MazolaEffect
        excludes:
          - "**/*.svg"
    resources:
      - paths:
          - MazolaEffect/Assets.xcassets
          - MazolaEffect/Preview Content
    settings:
      base:
        PRODUCT_NAME: Mazola Effect
        PRODUCT_BUNDLE_IDENTIFIER: com.superaplicativos.mazolaeffect
        INFOPLIST_FILE: MazolaEffect/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  MazolaEffect:
    build:
      targets:
        MazolaEffect: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
